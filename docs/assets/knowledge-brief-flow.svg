<text x="600" y="1312" text-anchor="middle" font-size="14" font-weight="400" style="fill:#475569">追加日期、主题、核心内容和输出目录</text>
<rect x="450" y="1384" width="300" height="64" rx="32" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/>
<text x="600" y="1425" text-anchor="middle" font-size="20" font-weight="700" style="fill:#ffffff">返回简报与清单链接</text>
