<text x="620" y="835" text-anchor="start" font-size="16" font-weight="600" style="fill:#2563eb">是</text>
<text x="940" y="784" text-anchor="middle" font-size="15" font-weight="400" style="fill:#64748b">仍无合格资料时</text>
<text x="940" y="810" text-anchor="middle" font-size="15" font-weight="400" style="fill:#64748b">说明原因，结束本次生成</text>
<rect x="430" y="856" width="340" height="72" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
