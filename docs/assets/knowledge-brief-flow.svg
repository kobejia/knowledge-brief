<text x="600" y="914" text-anchor="middle" font-size="14" font-weight="400" style="fill:#475569">由 Skill 确定，默认不逐次询问用户</text>
<rect x="430" y="976" width="340" height="80" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="600" y="1008" text-anchor="middle" font-size="21" font-weight="700" style="fill:#0f172a">生成知识简报</text>
<text x="600" y="1036" text-anchor="middle" font-size="14" font-weight="400" style="fill:#475569">按模板与风格 · 逻辑 / 流程用图表</text>
<polygon points="420,1112 800,1112 780,1200 400,1200" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
<text x="600" y="1146" text-anchor="middle" font-size="21" font-weight="700" style="fill:#0f172a">保存简报与图片</text>
<text x="600" y="1175" text-anchor="middle" font-size="14" font-weight="400" style="fill:#475569">src / 主题英文 / brief.md + images/</text>
<rect x="430" y="1248" width="340" height="88" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
