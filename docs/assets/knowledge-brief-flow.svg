<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
<title id="title">知识简报 Skill 精简流程</title>
<desc id="desc">拉起 Skill，读取配置、本次提示词和 src/list.json 历史清单，必要时读取相近简报原文。查证后确定新主题，保存 Markdown 与图片到 src 的英文主题目录，追加日期、主题、核心内容和输出目录到清单。</desc>
<defs>
